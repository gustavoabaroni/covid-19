<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Irapuã</title>
  <meta name="description" content="Painel de gestão da cidade de Irapuã/SP: mapa 3D, ocorrências e indicadores públicos.">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/painel.css">
</head>
<body>
  <div id="mapa" aria-label="Mapa 3D de Irapuã"></div>

  <header class="hud painel topo">
    <div class="brasao" aria-hidden="true">I</div>
    <div>
      <h1>Irapuã · Painel da Prefeitura</h1>
      <div class="sub">Prefeita Reni Aparecida da Silva · IBGE 3521507</div>
    </div>
    <div class="espaco"></div>
    <div class="relogio" id="relogio"></div>
    <a class="btn primario" href="ouvidoria.html" target="_blank" rel="noopener">+ Ouvidoria</a>
  </header>

  <div class="hud painel aviso-mapa" id="aviso-mapa" role="status"></div>

  <aside class="hud esquerda" aria-label="Indicadores">
    <section class="painel secao">
      <h2>Satisfação da população</h2>
      <div class="satisfacao" id="satisfacao"></div>
    </section>
    <section class="painel secao">
      <h2>Serviços</h2>
      <div class="indicadores" id="servicos"></div>
    </section>
    <section class="painel secao">
      <h2>Cidade em números <span id="tag-dados" style="text-transform:none;letter-spacing:0;font-weight:500"></span></h2>
      <div class="indicadores" id="indicadores"></div>
    </section>
  </aside>

  <aside class="hud direita" aria-label="Ocorrências">
    <section class="painel secao">
      <h2>Ocorrências</h2>
      <div class="resumo" id="resumo"></div>
    </section>
    <section class="painel secao">
      <h2>Filtrar por tipo</h2>
      <div class="filtros" id="filtros"></div>
    </section>
    <section class="painel secao lista-wrap">
      <h2>Fila de atendimento</h2>
      <div class="lista" id="lista"></div>
    </section>
  </aside>

  <nav class="hud painel controles" aria-label="Câmera">
    <button class="btn" id="btn-girar">⟳ Girar</button>
    <button class="btn" id="btn-2d">2D</button>
    <button class="btn" id="btn-centro">⌖ Centro</button>
  </nav>

  <nav class="hud painel abas" aria-label="Seções">
    <button data-aba="indicadores">📊 Indicadores</button>
    <button data-aba="ocorrencias">📍 Ocorrências</button>
  </nav>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/config.js"></script>
  <script src="data/snapshot.js"></script>
  <script src="data/ocorrencias-exemplo.js"></script>
  <script src="js/ouvidoria.js"></script>
  <script src="js/dados-publicos.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/hud.js"></script>
</body>
</html>
